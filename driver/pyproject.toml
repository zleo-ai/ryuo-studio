[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryuo"
version = "0.1.0"
description = "Clean-room host driver for the ASUS ROG RYUO IV AIO cooler screen"
readme = "README.md"
requires-python = ">=3.11"
# TODO(Maple): pick the licence before publishing. Suggested: MIT (see README).
dependencies = []

[project.optional-dependencies]
hid = ["hidapi>=0.14"]
test = ["pytest>=8"]

[project.scripts]
ryuo = "ryuo.cli:main"

[tool.setuptools]
packages = ["ryuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
